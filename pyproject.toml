[project]
name = "deliverygap-api"
version = "0.1.0"
description = "Evidence-based scope and delivery review API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "boto3>=1.35,<2",
  "redis>=5,<7",
  "rq>=2,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "pyjwt[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
  "pgvector>=0.4,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
pythonpath = ["apps/api", "."]
testpaths = ["apps/api/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["apps/api/app"]
strict = true

