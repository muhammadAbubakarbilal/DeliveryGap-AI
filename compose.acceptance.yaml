# Disposable synthetic acceptance stack. No host ports, host mounts, or production credentials.
name: deliverygap-acceptance
services:
  postgres:
    build:
      context: .
      dockerfile: infrastructure/acceptance-postgres.Dockerfile
    environment:
      POSTGRES_USER: acceptance
      POSTGRES_PASSWORD: acceptance-only-password
      POSTGRES_DB: acceptance
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acceptance -d acceptance"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: acceptance
      MINIO_ROOT_PASSWORD: acceptance-only-password
  acceptance:
    build:
      context: .
      dockerfile: infrastructure/acceptance.Dockerfile
    environment:
      RUN_INFRASTRUCTURE_ACCEPTANCE: "1"
      DATABASE_URL: postgresql+psycopg://acceptance:acceptance-only-password@postgres:5432/acceptance
      TEST_DATABASE_URL: postgresql+psycopg://acceptance:acceptance-only-password@postgres:5432/acceptance
      DATABASE_URL_UNPOOLED: ""
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: acceptance
      S3_SECRET_KEY: acceptance-only-password
      S3_BUCKET: acceptance-private
      APP_ORIGIN: http://localhost:3000
      NEON_AUTH_BASE_URL: ""
      NEON_AUTH_JWKS_URL: ""
      NEON_AI_GATEWAY_TOKEN: ""
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
