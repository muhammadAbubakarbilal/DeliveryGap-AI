name: deliverygap

x-api: &api
  build:
    context: .
    dockerfile: infrastructure/api.Dockerfile
  environment: &api-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-deliverygap}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-deliverygap}
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    SESSION_HOURS: ${SESSION_HOURS:-8}
    NEON_AI_GATEWAY_BASE_URL: ${NEON_AI_GATEWAY_BASE_URL:-}
    NEON_AI_GATEWAY_TOKEN: ${NEON_AI_GATEWAY_TOKEN:-}
    NEON_EMBEDDING_MODEL: ${NEON_EMBEDDING_MODEL:-qwen3-embedding-0-6b}
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    S3_BUCKET: deliverygap-private

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deliverygap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-deliverygap}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["object_data:/data"]

  migrate:
    <<: *api
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  seed:
    <<: *api
    profiles: ["tools"]
    command: ["/app/.venv/bin/python", "-m", "app.seed"]
    environment:
      <<: *api-env
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@deliverygap.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Workspace Admin}
    depends_on:
      migrate: { condition: service_completed_successfully }

  seed-demo:
    <<: *api
    profiles: ["tools"]
    command: ["/app/.venv/bin/python", "/app/scripts/seed_supervisor_demo.py"]
    environment:
      <<: *api-env
      DELIVERYGAP_API_URL: http://api:8000
      DELIVERYGAP_DEMO_COMPOSE: "1"
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@deliverygap.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      api: { condition: service_healthy }

  api:
    <<: *api
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: infrastructure/web.Dockerfile
    environment:
      INTERNAL_API_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }

  storage-init:
    <<: *api
    command: ["/app/.venv/bin/python", "-m", "app.storage_admin"]
    depends_on:
      minio: { condition: service_started }

  worker:
    <<: *api
    command: ["/app/.venv/bin/rq", "worker", "--url", "redis://redis:6379/0", "sources"]
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  dispatcher:
    <<: *api
    command: ["/app/.venv/bin/python", "-m", "app.source_jobs"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  storage-cleanup:
    <<: *api
    command: ["/app/.venv/bin/python", "-m", "app.storage_admin", "--cleanup-loop"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }

volumes:
  postgres_data:
  redis_data:
  object_data:
