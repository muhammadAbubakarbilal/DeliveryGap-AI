name: Foundation checks
on: [push, pull_request]
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exercise disposable PostgreSQL, Redis, MinIO and RQ recovery
        run: docker compose -f compose.acceptance.yaml up --build --abort-on-container-exit --exit-code-from acceptance
      - name: Remove disposable acceptance services
        if: always()
        run: docker compose -f compose.acceptance.yaml down --volumes --remove-orphans
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: deliverygap
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: deliverygap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deliverygap -d deliverygap"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://deliverygap:ci-only-password@localhost:5432/deliverygap?options=-csearch_path%3Dpublic%2Cdeliverygap_test_extensions
      TEST_DATABASE_URL: postgresql+psycopg://deliverygap:ci-only-password@localhost:5432/deliverygap
      APP_ORIGIN: http://localhost:3000
      PYTHONPATH: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.18", python-version: "3.12" }
      - uses: pnpm/action-setup@v4
        with: { version: "11.21.0" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: uv sync --frozen
      - name: Prepare isolated test extension namespace
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U deliverygap -d deliverygap -v ON_ERROR_STOP=1 < infrastructure/test-extensions.sql
      - run: pnpm install --frozen-lockfile
      - run: pnpm fixtures:validate
      - run: uv run ruff check apps/api scripts
      - run: uv run ruff format --check apps/api scripts
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q
      - run: uv run alembic downgrade base && uv run alembic upgrade head
      - run: uv run python scripts/export_openapi.py && pnpm api:types
      - run: git diff --exit-code docs/openapi.json apps/web/src/lib/api-types.ts
      - run: pnpm lint && pnpm typecheck && pnpm build
      - run: pnpm --filter @deliverygap/web exec playwright install --with-deps chromium
      - run: pnpm --filter @deliverygap/web exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/web/test-results
